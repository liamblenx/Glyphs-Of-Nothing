<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Artemis Glyph Matrix Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #ccc;
  }
  h1 {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 24px;
  }
  canvas {
    border: 1px solid #222;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  button {
    background: #1a1a1a;
    color: #aaa;
    border: 1px solid #333;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 1px;
  }
  button:hover { background: #252525; color: #fff; }
  .info {
    font-size: 12px;
    color: #444;
    margin-top: 12px;
  }
  .speed-label {
    font-size: 12px;
    color: #555;
  }
</style>
</head>
<body>

<h1>Artemis &middot; Glyph Matrix 25&times;25</h1>
<canvas id="matrix" width="500" height="500"></canvas>

<div class="controls">
  <button id="btnPause">Pause</button>
  <span class="speed-label">Speed:</span>
  <button id="btnSlower">-</button>
  <span id="speedVal" class="speed-label">1x</span>
  <button id="btnFaster">+</button>
</div>
<div class="info">Mirrors ArtemisRenderer.java &middot; 2s step, 120ms frames, 1.5s pulse &middot; grey corners are physically dark on Phone (3)</div>

<script>
const SIZE = 25;
const CELL = 20; // px per LED cell

// ── Earth (top-left, center ~5,5, radius ~3.5) ────────────────────
// Varying brightness for a realistic look:
//   - Brighter patches = land masses
//   - Medium = ocean
//   - Dim edges = limb darkening (spherical effect)
//
//   Visual map (brightness):
//              2    3    4    5    6    7    8
//         2        110  140  150  120
//         3   80   130  180  155  190  140   85
//         4  100   155  225  175  210  230  110
//         5  115   180  245  200  165  195  120
//         6  100   145  195  220  240  200  105
//         7   75   120  175  185  150  125   80
//         8        90   115  125  105
//
// const EARTH = [
//   // Row 2 (top edge — polar ice hint)
//   [3,2,180], [4,2,180], [5,2,255], [6,2,255],
//   // Row 3 ( polar ice hint)
//   [2,3,180],  [3,3,180], [4,3,180], [5,3,180], [6,3,255], [7,3,255],
//   // Row 4 (land mass upper)
//   [2,4,180], [3,4,180], [4,4,180], [5,4,180], [6,4,180], [7,4,255],
//   // Row 6 (land mass lower)
//   [2,5,255], [3,5,180], [4,5,180], [5,5,180], [6,5,180], [7,5,180],
//   // Row 7
//   [2,6,255], [3,6,255], [4,6,200], [5,6,200], [6,6,200], [7,6,200],
//   // Row 8 (bottom edge)
//   [3,7,255],  [4,7,255], [5,7,180], [6,7,180],
// ];

// The Phone (3) Glyph Matrix masks the 25x25 grid to an inscribed disc
// (cells whose centre is within ~12.5 of (12,12)). Art outside the disc is
// invisible on hardware — shaded grey below to show the cut-off.

const EARTH = [
  // Row 4 (top edge — polar ice hint)
  [7,4,180], [8,4,180], [9,4,255], [10,4,255],
  // Row 5 (polar ice hint)
  [6,5,180], [7,5,180], [8,5,180], [9,5,180], [10,5,255], [11,5,255],
  // // Row 6 (land mass upper)
  [6,6,180], [7,6,180], [8,6,180], [9,6,180], [10,6,180], [11,6,255],
  // // Row 7 (land mass lower)
  [6,7,255], [7,7,180], [8,7,180], [9,7,180], [10,7,180], [11,7,180],
  // // Row 8
  [6,8,255], [7,8,255], [8,8,200], [9,8,200], [10,8,200], [11,8,200],
  // // Row 9 (bottom edge)
  [7,9,255], [8,9,255], [9,9,180], [10,9,180],
];



// ── Moon (bottom-right, center ~20,20, radius ~2.5) ───────────────
// Darker overall with crater texture:
//   - Brightest ~110 (highlands)
//   - Darkest ~35 (maria / craters)
//
//   Visual map:
//             18   19   20   21   22
//       18         50   60   55
//       19    40   75  100   80   55
//       20    55   95  110   90   65
//       21    45   85   95  105   50
//       22         45   55   50
//
const MOON = [
  // Row 16 (top edge)
  [15,17,50], [16,17,60], [17,17,55],
  // Row 17
  [14,18,40], [15,18,75], [16,18,100], [17,18,80], [18,18,55],
  // Row 18 (center)
  [14,19,55], [15,19,95], [16,19,110], [17,19,90], [18,19,65],
  // Row 19
  [14,20,45], [15,20,85], [16,20,95], [17,20,105], [18,20,50],
  // Row 20 (bottom edge)
  [15,21,45], [16,21,55], [17,21,50],
];

// TO ADD

const STAGE_BOX = [
  // [17,6, 255],
  [19,6, 255],
  [20,6, 255],
  [21,6, 255],
  [22,6, 255],
  [16,7, 255],
  [16,8, 255],
  [16,9, 255],
  [16,10, 255],
  [16,11, 255],
  [16,12, 255],
  [19,13, 255],
  [20,13, 255],
  [21,13, 255],
  [22,13, 255],
  [21,13, 255],
  // [22,11, 255],
  // [23,10, 255],
  // [22,7, 255],
  // [23,8, 255],

] 

const STAGE_INT = [
  // [24,9, 255],
  // [23,9, 255],
   [18,8, 255],
   [18,9, 255],
   [18,10, 255],
   [18,11, 255],

   [20,8, 255],
   [20,9, 255],
   [20,10, 255],
   [21,10, 255],
   [22,9, 255],
   [22,10, 255],
   [22,11, 255],
  ]
  // [22,15, 255],
  // [23,15, 255],
  // [24,15, 255],

// ── Trajectory (smooth, diagonal path from Earth to Moon and back) ─
// Outbound: curves RIGHT of the Earth→Moon diagonal (upper side)
// Flyby:    tight loop around far side of Moon
// Return:   curves LEFT of diagonal (lower side) back to Earth
const TRAJECTORY = [
  // ── Earth Slingshot Rot 1──
  [7, 2],
  [5, 3],
  [4, 5],
  [4, 8],
  [5, 10],
  [7, 11],
  [10, 11],
  [12, 10],
  [13, 8],
  [13, 5],
  [12, 3],
  [10, 2],
  // ── Earth Slingshot Rot 2──
   [7, 2],
  [5, 3],
  [4, 5],
  [4, 8],
  [5, 10],
  [7, 11],
  // ── Depart Earth Slingshot ──
  [10, 13],
  [13, 14],
  // ── Arrive Moon──
  [16, 15],
  [19, 16],
  [20, 18],
  [20, 20],
  [19, 22],
  [17, 23],
  [15, 23],
  [13, 22],
  [12, 20],
  [12, 18],
  [13, 14],
  [14, 10],
  [13, 5],
  // ── Depart Moon──
  // [11, 12],
  // [10, 8],
  // ── Arrive back at Earth ──
];

// ── Brightness ─────────────────────────────────────────────────────
// Mirror ArtemisRenderer.java — keep these in sync for faithful testing.

const B_PATH = 50;
const B_CRAFT_MAX = 255;
const B_CRAFT_MIN = 140;

// ── Timing ─────────────────────────────────────────────────────────
// Mirror ArtemisGlyphToyService.java:
//   STEP_INTERVAL_MS  = 2000 → waypoint advance cadence
//   FRAME_INTERVAL_MS = 120  → frame push cadence (~8 fps)
//   pulse cycle       = 1500 ms (ArtemisRenderer.mAnimRunnable)

const STEP_MS = 2000;
const FRAME_INTERVAL_MS = 120;
const PULSE_CYCLE_MS = 1500;

// ── State ──────────────────────────────────────────────────────────

let craftIndex = 0;
let paused = false;
let speed = 1;
let lastStep = performance.now();
let lastFrameTime = 0;

// ── Rendering ──────────────────────────────────────────────────────

const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

// Hardware disc mask: cell centre must be within ~12.5 of (12,12).
const DISC_CENTER = 12;
const DISC_RADIUS_SQ = 12.5 * 12.5;
function isOnDisc(x, y) {
  const dx = x - DISC_CENTER, dy = y - DISC_CENTER;
  return dx * dx + dy * dy <= DISC_RADIUS_SQ;
}

function renderFrame(timestamp) {
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Shade corner cells that are dark on hardware (outside the disc mask)
  ctx.fillStyle = '#141414';
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (!isOnDisc(x, y)) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }

  // Subtle grid
  ctx.strokeStyle = '#0e0e0e';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE * CELL, i * CELL); ctx.stroke();
  }

  // Helper: draw an LED dot with per-pixel brightness.
  // Hardware ignores cells outside the disc mask, so suppress them here too —
  // this surfaces any art/trajectory cell that would be invisible on device.
  function led(x, y, brightness) {
    if (!isOnDisc(x, y)) return;
    const r = CELL / 2 - 2;
    const cx = x * CELL + CELL / 2;
    const cy = y * CELL + CELL / 2;
    const alpha = brightness / 255;

    // Glow halo
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 3);
    grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
    grad.addColorStop(0.5, `rgba(255,255,255,${alpha * 0.3})`);
    grad.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Earth (each pixel has its own brightness)
  for (const [x, y, b] of EARTH) led(x, y, b);

  // Moon (darker, per-pixel brightness)
  for (const [x, y, b] of MOON) led(x, y, b);

  // Stage (brighter, per-pixel brightness)
  for (const [x, y, b] of STAGE_BOX) led(x, y, b);
  
  // Stage (brighter, per-pixel brightness)
  for (const [x, y, b] of STAGE_INT) led(x, y, b);

  // Trajectory + pulsing spacecraft
  const pulse = 0.5 + 0.5 * Math.sin((timestamp % PULSE_CYCLE_MS) / PULSE_CYCLE_MS * Math.PI * 2);

  for (let i = 0; i < TRAJECTORY.length; i++) {
    const [x, y] = TRAJECTORY[i];
    if (i === craftIndex) {
      const b = Math.round(B_CRAFT_MIN + pulse * (B_CRAFT_MAX - B_CRAFT_MIN));
      led(x, y, b);
    } else {
      led(x, y, B_PATH);
    }
  }

  // Simulator-only labels
  ctx.font = '9px monospace';
  ctx.fillStyle = '#282828';
  ctx.fillText('EARTH', 2 * CELL, 11.5 * CELL);
  ctx.fillText('MOON', 14 * CELL, 22.2 * CELL);
}

// ── Animation loop ─────────────────────────────────────────────────

function loop(timestamp) {
  if (!paused) {
    if (timestamp - lastStep >= STEP_MS / speed) {
      craftIndex = (craftIndex + 1) % TRAJECTORY.length;
      lastStep = timestamp;
    }
  }
  // Match the service's frame push cadence (FRAME_INTERVAL_MS). The speed
  // control scales it too so fast-forward stays smooth.
  if (timestamp - lastFrameTime >= FRAME_INTERVAL_MS / speed) {
    renderFrame(timestamp);
    lastFrameTime = timestamp;
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// ── Controls ───────────────────────────────────────────────────────

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? 'Resume' : 'Pause';
});

document.getElementById('btnSlower').addEventListener('click', () => {
  speed = Math.max(0.25, speed / 2);
  document.getElementById('speedVal').textContent = speed + 'x';
});

document.getElementById('btnFaster').addEventListener('click', () => {
  speed = Math.min(8, speed * 2);
  document.getElementById('speedVal').textContent = speed + 'x';
});
</script>
</body>
</html>
